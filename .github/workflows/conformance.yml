name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Python drivers' dependencies
        # nobulex needs an Ed25519 library; the APS driver needs cedarpy and the
        # published Passport SDK. Both publish wheels, so this is a pip step, not
        # a toolchain. Without it both drivers exit 77 and the suite verifies
        # only the reference implementation.
        run: python -m pip install --quiet pynacl cedarpy==4.8.7 agent-passport-system

      - name: Make scripts executable
        run: chmod +x conformance/*.sh implementations/*/run.sh evidence-predicate/run.sh verifier-vectors/run.mjs

      - name: Run all implementation drivers
        run: ./conformance/run.sh

      - name: Verify evidence predicate vectors
        run: ./evidence-predicate/run.sh

      - name: Verifier vectors (key windows, farley-receipt-signature, embedded keys)
        # Pinned to the first verifier release implementing -04 Section 5.5. Until it is on npm the runner exits 77
        # and this step reports a skip, not a failure. See verifier-vectors/README.md.
        run: |
          set +e
          node verifier-vectors/run.mjs
          rc=$?
          if [ "$rc" -eq 77 ]; then echo "::notice::verifier vectors skipped: the pinned verifier is not installable yet"; exit 0; fi
          exit $rc

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-receipts-node${{ matrix.node }}
          path: receipts/
