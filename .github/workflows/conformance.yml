name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Python drivers' dependencies
        # nobulex needs an Ed25519 library; the APS driver needs cedarpy and the
        # published Passport SDK. Both publish wheels, so this is a pip step, not
        # a toolchain. Without it both drivers exit 77 and the suite verifies
        # only the reference implementation.
        run: python -m pip install --quiet pynacl cedarpy==4.8.7 agent-passport-system

      - name: Make scripts executable
        run: chmod +x conformance/*.sh implementations/*/run.sh evidence-predicate/run.sh verifier-vectors/run.mjs

      - name: Run all implementation drivers
        run: ./conformance/run.sh

      - name: Verify evidence predicate vectors
        run: ./evidence-predicate/run.sh

      - name: Verifier vectors that need no verifier (fixtures current, timeliness reference evaluation)
        # Runs while the pinned verifier below is still a skip: every generated file is current, and the timeliness
        # reference evaluation reaches its expected verdicts and catches its planted defects.
        run: |
          node verifier-vectors/key-window/scripts/generate.mjs --check
          node verifier-vectors/revocation/scripts/generate.mjs --check
          node verifier-vectors/timeliness/scripts/generate.mjs --check
          node verifier-vectors/signing-input/scripts/generate.mjs --check
          node verifier-vectors/chain-link/scripts/generate.mjs --check
          node verifier-vectors/finos-mi24-decision-record/scripts/generate.mjs --check
          node verifier-vectors/timeliness/scripts/check.mjs

      - name: Verifier vectors (key windows, farley-receipt-signature, embedded keys, revocation, timeliness, signing input, chain links)
        # Pinned to 0.11.0, published with npm provenance, the first release with the fix for GHSA-whwv-ppvg-jwgx. It
        # reads key windows from the signed issued_at only and never trusts keys carried in the file it checks. 0.10.26
        # was the first to check a receipt against a supplied predecessor (--previous), to read --jwks with
        # --replay-chain, and to combine checks as Section 5.3 of the -04 editor's copy (VeritasActa/drafts#6) does.
        # 0.10.22 was the first to refuse a malformed or other-algorithm chain link on a receipt checked alone (-03
        # Section 6.7), and 0.10.21 the first implementing the editor's copy's Section 5.5 and the -03 Section 6.6
        # refusal. If the pinned release is not on npm the runner exits 77 and this step reports a skip, not a failure.
        # See verifier-vectors/README.md.
        run: |
          set +e
          node verifier-vectors/run.mjs
          rc=$?
          if [ "$rc" -eq 77 ]; then echo "::notice::verifier vectors skipped: the pinned verifier is not installable yet"; exit 0; fi
          exit $rc

      - name: FINOS MI-24 decision records as Acta receipts (verifier 0.11.1, the A-DoA schema v1.1.0, MI-24's rules)
        # Vectors for the A-DoA Decision Record Schema v1.1.0 (vendored unchanged, CC BY 4.0), which FINOS MI-24 cites;
        # not reviewed or endorsed by FINOS or the schema's author. The pinned verifier checks each receipt's signature,
        # key and chain; the runner then checks the record against the schema, the schema it names and its resolved
        # action digest, and the rules MI-24's text adds beyond the schema, and sweeps each check off in turn. Pinned to
        # 0.11.1, published with npm provenance, installed with ajv 8.20.0 and ajv-formats 3.0.1 (which 0.11.1 itself
        # depends on) into a temporary prefix; ajv cross-checks the dependency-free schema check, with format read as an
        # annotation and asserted. If the verifier cannot be installed the runner exits 77 and this step reports a skip,
        # not a failure. See verifier-vectors/finos-mi24-decision-record/README.md.
        run: |
          set +e
          npm install --prefix "$RUNNER_TEMP/verify-0.11.1" --no-save --no-audit --no-fund @veritasacta/verify@0.11.1 ajv@8.20.0 ajv-formats@3.0.1
          VERIFY_CMD="$RUNNER_TEMP/verify-0.11.1/node_modules/.bin/verify" node verifier-vectors/finos-mi24-decision-record/run.mjs
          rc=$?
          if [ "$rc" -eq 77 ]; then echo "::notice::MI-24 draft vectors skipped: the pinned verifier is not installable"; exit 0; fi
          if [ "$rc" -ne 0 ]; then exit $rc; fi
          node verifier-vectors/finos-mi24-decision-record/scripts/crosscheck-ajv.mjs "$RUNNER_TEMP/verify-0.11.1"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/setup-python@v5
        # agent-evidence-vectors requires Python 3.13; this step and the ones after it use it,
        # and every earlier driver keeps the 3.12 set up above.
        with:
          python-version: '3.13'
      - name: Verifier vectors from agent-evidence-vectors (receipt-signature corpus, same pinned verifier)
        # Installs the release by wheel hash, checks its corpus digest against the release's signed digest list, and
        # replays its receipt-signature corpus through the 0.11.0 verifier pinned above. See
        # verifier-vectors/agent-evidence-vectors/README.md.
        run: |
          python -m pip install --quiet --require-hashes -r verifier-vectors/agent-evidence-vectors/requirements.txt
          npm install --prefix "$RUNNER_TEMP/verify" --no-save --no-audit --no-fund @veritasacta/verify@0.11.0
          export PATH="$RUNNER_TEMP/verify/node_modules/.bin:$PATH"
          mkdir -p receipts
          ./verifier-vectors/agent-evidence-vectors/run.sh

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-receipts-node${{ matrix.node }}
          path: receipts/
